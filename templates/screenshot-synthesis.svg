  <text x="50" y="424" font-size="11" fill="#8a98a8">Pourquoi : host probing many targets, scanner or discovery phase</text>

  <rect x="36" y="440" width="648" height="62" rx="6" fill="#0f151d"/>
  <rect x="36" y="440" width="4" height="62" fill="#f97316"/>
  <text x="50" y="460" font-size="13" font-weight="700" fill="#d7e0ea">ATTENTION · Successful logins observed</text>
  <text x="50" y="480" font-size="12" fill="#d7e0ea">Constat : 42 successful login(s). Accounts: svc_demo</text>
  <text x="50" y="496" font-size="11" fill="#8a98a8">Pourquoi : authentication after probing, validate account and source</text>

  <rect x="36" y="512" width="648" height="62" rx="6" fill="#0f151d"/>
  <rect x="36" y="512" width="4" height="62" fill="#f97316"/>
  <text x="50" y="532" font-size="13" font-weight="700" fill="#d7e0ea">ATTENTION · Ports associated with attack tools</text>
  <text x="50" y="552" font-size="12" fill="#d7e0ea">Constat : Observed ports: 4444</text>
  <text x="50" y="568" font-size="11" fill="#8a98a8">Pourquoi : frequently used by post-exploitation tools or C2</text>

  <rect x="36" y="584" width="648" height="62" rx="6" fill="#0f151d"/>
  <rect x="36" y="584" width="4" height="62" fill="#ef4444"/>
  <text x="50" y="604" font-size="13" font-weight="700" fill="#d7e0ea">CRITIQUE · Large outbound transfer</text>
  <text x="50" y="624" font-size="12" fill="#d7e0ea">Constat : 512.4 MB sent</text>
  <text x="50" y="640" font-size="11" fill="#8a98a8">Pourquoi : possible exfiltration, check the destination</text>

