  <rect x="720" y="330" width="660" height="160" rx="10" fill="#131a22" stroke="#243041"/>
  <text x="736" y="354" font-size="14" font-weight="700" fill="#4cc3ff">QUESTIONS À TRANCHER</text>
  <text x="736" y="384" font-size="12" fill="#d7e0ea">• Is 10.20.1.15 an authorised scanner? Confirm with the asset owner.</text>
  <text x="736" y="408" font-size="12" fill="#d7e0ea">• Which accounts logged in successfully, and at what time?</text>
  <text x="736" y="432" font-size="12" fill="#d7e0ea">• Why does this host reach database and proxy servers?</text>

  <!-- Actions card -->
  <rect x="720" y="500" width="660" height="160" rx="10" fill="#131a22" stroke="#243041"/>
  <text x="736" y="524" font-size="14" font-weight="700" fill="#4cc3ff">ACTIONS RECOMMANDÉES</text>
  <text x="736" y="554" font-size="12" fill="#d7e0ea">• Obtain confirmation from the source asset owner within 4 hours.</text>
  <text x="736" y="578" font-size="12" fill="#d7e0ea">• Check successful logins and the accounts used.</text>
  <text x="736" y="602" font-size="12" fill="#d7e0ea">• Document the decision in the offence notes.</text>

