  <text x="260" y="734" font-size="13" fill="#d7e0ea">DEMO: Internal host sweeping multiple servers</text>
  <text x="36" y="760" font-size="13" fill="#8a98a8">Statut</text>
  <text x="260" y="760" font-size="13" fill="#d7e0ea">OPEN</text>
  <text x="36" y="786" font-size="13" fill="#8a98a8">Assignée à</text>
  <text x="260" y="786" font-size="13" fill="#d7e0ea">analyst.demo</text>
  <text x="36" y="812" font-size="13" fill="#8a98a8">Sévérité QRadar</text>
  <text x="260" y="812" font-size="13" fill="#d7e0ea">MEDIUM · Moderate risk, monitor closely</text>
