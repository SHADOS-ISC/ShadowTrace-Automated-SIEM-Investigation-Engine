    <rect x="20" y="250" width="161" height="60" rx="10" fill="#131a22" stroke="#243041"/>
    <rect x="191" y="250" width="161" height="60" rx="10" fill="#131a22" stroke="#243041"/>
    <rect x="362" y="250" width="161" height="60" rx="10" fill="#131a22" stroke="#243041"/>
