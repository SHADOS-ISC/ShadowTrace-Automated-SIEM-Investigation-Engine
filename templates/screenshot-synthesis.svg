    <rect x="875" y="250" width="161" height="60" rx="10" fill="#131a22" stroke="#243041"/>
    <rect x="1046" y="250" width="161" height="60" rx="10" fill="#131a22" stroke="#243041"/>
    <rect x="1217" y="250" width="161" height="60" rx="10" fill="#131a22" stroke="#243041"/>
