  <!-- Signals card -->
  <rect x="20" y="330" width="680" height="330" rx="10" fill="#131a22" stroke="#243041"/>
  <text x="36" y="354" font-size="14" font-weight="700" fill="#4cc3ff">SIGNAUX DÉTECTÉS (4)</text>

